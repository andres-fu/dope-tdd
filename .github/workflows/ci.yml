# The two checks the mods docs name, on both platforms the plugin claims:
# `claude plugin validate` reads the manifest and the hooks module the way the
# engine will; `claude plugin test` runs tests/ with no session, sign-in or
# network. Validation is not --strict because the manifest omits `version` on
# purpose (git-hosted marketplace: the commit is the version, so every push
# reaches testers as an update); strict mode would fail on that alone.
name: ci

on:
  push:
  pull_request:

jobs:
  plugin:
    name: validate and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Claude Code version
        run: claude --version
      - name: Validate the plugin the way the engine reads it
        run: claude plugin validate .
      - name: Run the plugin's tests
        shell: bash
        run: claude plugin test . | tee test-output.txt
      - name: Report where the test time went
        if: always()
        shell: bash
        run: node tools/ci/timings.mjs test-output.txt --slow-ms 1000
      - name: Run the plugin's tests again with a POSIX fixture root
        run: node tools/posix-root.mjs
      - name: Check the scorecard arithmetic
        run: node --test tools/pool/scorecard.test.mjs
      - name: Check the bug-search rules
        run: node --test tools/pool/find-bugs.test.mjs
      - name: Check the pull-request check report
        run: npx -y tsx@4.19.2 --test tools/pr-check/check.spec-node.ts
      - name: Check the test-time report
        run: node --test tools/ci/timings.test.mjs
      - name: Check the pull-request check end to end, on a throwaway repository
        run: npx -y tsx@4.19.2 --test tools/pr-check/flow.spec-node.ts
      - name: Check the move check's reading of git
        run: npx -y tsx@4.19.2 --test tools/move-check/check.spec-node.ts
      - name: Check the move check
        run: npx -y tsx@4.19.2 --test tools/move-check/move.spec-node.ts
      - name: Check the launcher helpers
        run: node --test tools/pool/ab.test.mjs
      - name: Check the transcript replay
        run: npx -y tsx@4.19.2 --test tools/replay/replay.spec-node.ts
