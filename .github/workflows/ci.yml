# The two checks the mods docs name, on both platforms the plugin claims:
# `claude plugin validate` reads the manifest and the hooks module the way the
# engine will; `claude plugin test` runs tests/ with no session, sign-in or
# network. Validation is --strict: the manifest sets `version` (since 0.2.1), so
# testers get an update only when a release bumps it.
name: ci

# Cost (Actions minutes are billed on a private repository; macOS counts 10x, Windows 2x):
# - one run per change: pull requests, and pushes to main only, not every branch push as well;
# - a new push to a pull request cancels the run still going for the one before it;
# - macOS runs on main, not on every pull request; Linux and Windows run on both, Windows being where
#   most of this plugin's path and line-ending bugs show up.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plugin:
    name: validate and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'push' && fromJSON('["ubuntu-latest", "windows-latest", "macos-latest"]') || fromJSON('["ubuntu-latest", "windows-latest"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Claude Code version
        run: claude --version
      - name: Validate the plugin the way the engine reads it
        run: claude plugin validate --strict .
      - name: Run the plugin's tests
        shell: bash
        run: claude plugin test . | tee test-output.txt
      - name: Run the unit tests on node --test, the loop dope-tdd guards here
        run: node --import ./tests/node/register.mjs --test "tests/*.test.ts" "tests/node/*.test.mjs"
      - name: Report where the test time went
        if: always()
        shell: bash
        run: node tools/ci/timings.mjs test-output.txt --slow-ms 1000
      - name: Run the plugin's tests again with a POSIX fixture root
        run: node tools/posix-root.mjs
      - name: Check the pull-request check report
        run: node --test tools/pr-check/check.spec-node.ts
      - name: Check the test-time report
        run: node --test tools/ci/timings.test.mjs
      - name: Check the npm run check runner
        run: node --test tools/check/check.test.mjs
      - name: Check the pull-request check end to end, on a throwaway repository
        run: node --test tools/pr-check/flow.spec-node.ts
      - name: Check the move check's reading of git
        run: node --test tools/move-check/check.spec-node.ts
      - name: Check the move check
        run: node --test tools/move-check/move.spec-node.ts
      - name: Check the transcript replay
        run: node --test tools/replay/replay.spec-node.ts
