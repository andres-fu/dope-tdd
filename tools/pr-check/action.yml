name: Dope TDD pull-request check
description: Do the tests catch this change? Runs Dope TDD's catch check on a pull request's diff, for any agent or person.
inputs:
  base:
    description: The branch the pull request goes into (usually github.base_ref).
    required: true
  fail-on:
    description: "missed (default): fail when a test does not catch the change; untested: also fail when a changed module has no test; never: report only."
    required: false
    default: missed
  timeout-ms:
    description: How long one test run may take.
    required: false
    default: '180000'
runs:
  using: composite
  steps:
    # Inputs reach the scripts as environment variables, never written into them: `${{ … }}` inside run:
    # is pasted in before bash reads it, so a crafted value would run as shell (#191).
    - name: Fetch the base branch
      shell: bash
      env:
        BASE: ${{ inputs.base }}
      run: git fetch --no-tags --depth=200 origin "$BASE"
    - name: Do the tests catch this change?
      shell: bash
      env:
        BASE: ${{ inputs.base }}
        FAIL_ON: ${{ inputs.fail-on }}
        TIMEOUT_MS: ${{ inputs.timeout-ms }}
      run: >
        npx -y tsx@4.19.2 "$GITHUB_ACTION_PATH/check.ts"
        --repo "$GITHUB_WORKSPACE"
        --base "origin/$BASE"
        --fail-on "$FAIL_ON"
        --timeout-ms "$TIMEOUT_MS"
